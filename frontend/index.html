<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>ChatLLM Lab</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css"
    />
    <style>
      :root {
        --bg-page: #ffffff;
        --text: #0d0d0d;
        --muted: #8e8ea0;
        --accent: #1a1a1a;
        --accent-hover: #404040;
        --user-bubble: #f4f4f4;
        --border: #e5e5e5;
        --composer-bg: #ffffff;
        --composer-border: #d9d9d9;
        --sidebar-bg: #f7f7f8;
        --sidebar-width: 260px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--bg-page);
        color: var(--text);
        font-family: ui-sans-serif, -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      /* --- Sidebar --- */
      .sidebar {
        width: var(--sidebar-width);
        height: 100%;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow: hidden;
      }

      .sidebar-header {
        padding: 12px;
        border-bottom: 1px solid var(--border);
      }

      .new-chat-btn {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 0.88rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: background 120ms ease;
      }

      .new-chat-btn:hover {
        background: var(--user-bubble);
      }

      .sidebar-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }

      .sidebar-item {
        padding: 10px 12px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        transition: background 120ms ease;
        margin-bottom: 2px;
      }

      .sidebar-item:hover {
        background: var(--user-bubble);
      }

      .sidebar-item.active {
        background: var(--border);
      }

      .sidebar-item-title {
        font-size: 0.85rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }

      .sidebar-item-del {
        flex-shrink: 0;
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 4px;
        border-radius: 4px;
        opacity: 0;
        transition: opacity 120ms ease;
      }

      .sidebar-item:hover .sidebar-item-del {
        opacity: 1;
      }

      .sidebar-item-del:hover {
        color: #c0392b;
        background: rgba(192, 57, 43, 0.1);
      }

      .app-layout {
        width: 100%;
        height: 100%;
        display: flex;
      }

      .app-shell {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .app-header {
        flex-shrink: 0;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .sidebar-toggle {
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 6px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        transition: background 120ms ease;
      }

      .sidebar-toggle:hover {
        background: var(--user-bubble);
        color: var(--text);
      }

      .brand {
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--text);
        letter-spacing: 0;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .user-email {
        font-size: 0.82rem;
        color: var(--muted);
      }

      .logout-btn {
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 4px 14px;
        font-size: 0.82rem;
        color: var(--text);
        cursor: pointer;
        transition: background 120ms ease;
      }

      .logout-btn:hover {
        background: var(--user-bubble);
      }

      /* --- Custom instructions modal --- */
      .header-btn {
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 4px 14px;
        font-size: 0.82rem;
        color: var(--text);
        cursor: pointer;
        transition: background 120ms ease;
      }

      .header-btn:hover {
        background: var(--user-bubble);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 50;
      }

      .modal {
        width: 100%;
        max-width: 640px;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 24px;
        border-radius: 16px;
        background: var(--bg-page);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        animation: slideUp 180ms ease-out;
      }

      .modal-title {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
      }

      .modal-subtitle {
        margin: 0;
        font-size: 0.88rem;
        color: var(--muted);
        line-height: 1.5;
      }

      .modal-badge {
        display: inline-block;
        margin-left: 8px;
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--user-bubble);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 0.75rem;
      }

      .modal-textarea {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        padding: 12px 14px;
        border: 1px solid var(--composer-border);
        border-radius: 10px;
        font: inherit;
        font-size: 0.92rem;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg-page);
        outline: none;
      }

      .modal-textarea:focus {
        border-color: #b0b0b0;
      }

      .modal-meta {
        display: flex;
        gap: 12px;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .modal-status {
        color: #1e7e34;
      }

      .modal-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      .modal-actions-right {
        display: flex;
        gap: 8px;
      }

      .modal-btn {
        padding: 8px 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 0.88rem;
        cursor: pointer;
        transition: background 120ms ease;
      }

      .modal-btn:hover:not(:disabled) {
        background: var(--user-bubble);
      }

      .modal-btn.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .modal-btn.primary:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      .modal-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .modal-btn.ghost {
        border-color: transparent;
        color: var(--muted);
      }

      /* --- Auth styles --- */
      .auth-shell {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-page);
        padding: 24px;
      }

      .auth-card {
        width: 100%;
        max-width: 400px;
        padding: 40px 32px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--bg-page);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      }

      .auth-brand {
        font-weight: 700;
        font-size: 1.4rem;
        text-align: center;
        margin: 0 0 4px;
        color: var(--text);
      }

      .auth-title {
        font-weight: 400;
        font-size: 1rem;
        text-align: center;
        margin: 0 0 24px;
        color: var(--muted);
      }

      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .auth-form input {
        padding: 12px 14px;
        border: 1px solid var(--composer-border);
        border-radius: 10px;
        font: inherit;
        font-size: 0.95rem;
        color: var(--text);
        background: var(--bg-page);
        outline: none;
        transition: border-color 150ms ease;
      }

      .auth-form input:focus {
        border-color: #b0b0b0;
      }

      .auth-form button {
        margin-top: 8px;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 120ms ease;
      }

      .auth-form button:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      .auth-form button:disabled {
        background: #d9d9d9;
        cursor: not-allowed;
      }

      .auth-error {
        color: #c0392b;
        font-size: 0.85rem;
        text-align: center;
        padding: 6px 0;
      }

      .auth-toggle {
        text-align: center;
        font-size: 0.88rem;
        color: var(--muted);
        margin: 20px 0 0;
      }

      .auth-toggle a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
      }

      .auth-toggle a:hover {
        text-decoration: underline;
      }

      .messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        padding: 32px 16px 16px;
      }

      .messages-inner {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .bubble {
        line-height: 1.65;
        word-break: break-word;
        overflow-wrap: anywhere;
        animation: slideUp 180ms ease-out;
        padding: 20px 0;
      }

      .bubble + .bubble {
        border-top: none;
      }

      .bubble.assistant {
        align-self: flex-start;
        width: 100%;
        font-size: 1rem;
        color: var(--text);
      }

      .bubble.user {
        align-self: flex-end;
        background: var(--user-bubble);
        padding: 12px 18px;
        border-radius: 18px;
        max-width: 78%;
        font-size: 1rem;
      }

      .bubble pre {
        margin: 12px 0;
        padding: 16px;
        border-radius: 12px;
        overflow-x: auto;
        background: #f4f4f4;
        border: 1px solid var(--border);
        font-size: 0.875rem;
      }

      .code-block-wrap {
        position: relative;
      }

      .code-copy-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(17, 24, 39, 0.75);
        color: #f9fafb;
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 0.73rem;
        cursor: pointer;
        z-index: 2;
      }

      .code-copy-btn:hover {
        background: rgba(31, 41, 55, 0.95);
      }

      .bubble code {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.875em;
      }

      .bubble :not(pre) > code {
        padding: 2px 5px;
        border-radius: 4px;
        background: #f4f4f4;
        border: 1px solid var(--border);
        font-size: 0.875em;
      }

      .composer-wrap {
        flex-shrink: 0;
        padding: 8px 16px 20px;
      }

      .note {
        max-width: 720px;
        margin: 0 auto 8px;
        padding: 4px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .error {
        color: #c0392b;
      }

      .composer {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--composer-bg);
        border: 1px solid var(--composer-border);
        border-radius: 28px;
        padding: 8px 10px 8px 18px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      .composer:focus-within {
        border-color: #b0b0b0;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      }

      .composer input {
        flex: 1;
        border: none;
        background: transparent;
        padding: 6px 0;
        font: inherit;
        font-size: 1rem;
        color: var(--text);
        outline: none;
      }

      .composer input::placeholder {
        color: var(--muted);
      }

      .composer button {
        flex-shrink: 0;
        border: 0;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition: background 120ms ease, transform 100ms ease;
      }

      .composer button:hover:not(:disabled) {
        background: var(--accent-hover);
        transform: scale(1.05);
      }

      .composer button:disabled {
        background: #d9d9d9;
        cursor: not-allowed;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 640px) {
        .bubble.user { max-width: 90%; }
        .messages { padding: 20px 12px 12px; }
        .composer-wrap { padding: 8px 12px 16px; }
      }    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.22.20/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    ></script>
    <script type="text/babel" src="/frontend/src/api.js"></script>
    <script type="text/babel" src="/frontend/src/Auth.jsx"></script>
    <script type="text/babel" src="/frontend/src/MessageContent.jsx"></script>
    <script type="text/babel" src="/frontend/src/Composer.jsx"></script>
    <script type="text/babel" src="/frontend/src/Sidebar.jsx"></script>
    <script type="text/babel" src="/frontend/src/InstructionsModal.jsx"></script>
    <script type="text/babel" src="/frontend/src/App.jsx"></script>
  </body>
</html>
